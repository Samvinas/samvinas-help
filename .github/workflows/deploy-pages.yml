name: Deploy to GitHub Pages

# Builds the Markdown → HTML and publishes dist/ to GitHub Pages on every push
# to main. Enable once under Settings → Pages → "Build and deployment" → GitHub
# Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # help.samvinas.com is served by Cloudflare Worker static assets, which
      # Cloudflare builds from this repo on push — independently of this
      # workflow. The edge cache pins the OLD HTML past deploys (bit us
      # 2026-08-10: tabbed tool pages sat behind week-old cache), so we purge —
      # but only after a delay, or the purge races Cloudflare's own build and
      # the edge re-caches stale pages. Token is scoped to Zone → Cache Purge
      # on samvinas.com only.
      - name: Purge Cloudflare cache (help.samvinas.com)
        run: |
          sleep 120
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_CACHE_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"hosts":["help.samvinas.com"]}' \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            | grep -q '"success":true'
